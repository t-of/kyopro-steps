<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- 配列のバー（アルゴリズムをステップで追う図） -->
  <line x1="60" y1="400" x2="452" y2="400" stroke="#333333" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#1b1f27" stroke-width="3">
    <rect x="80"  y="280" width="56" height="120" rx="8" fill="#5c8dff"/>
    <rect x="154" y="180" width="56" height="220" rx="8" fill="#4cb36b"/>
    <rect x="228" y="240" width="56" height="160" rx="8" fill="#ffb15c"/>
    <rect x="302" y="120" width="56" height="280" rx="8" fill="#5c8dff"/>
    <rect x="376" y="310" width="56" height="90"  rx="8" fill="#ffb15c"/>
  </g>

  <!-- 今見ているステップを示す矢印 -->
  <polygon points="330,60 300,96 360,96" fill="#1b1f27"/>
  <rect x="320" y="96" width="20" height="20" fill="#1b1f27"/>
  <rect x="296" y="112" width="68" height="8" rx="4" fill="#1b1f27"/>
</svg>
